name: omnireach-production

x-logging: &production-logging
  driver: json-file
  options:
    max-file: '5'
    max-size: 10m

x-runtime-secrets: &runtime-secrets
  - postgres_app_password
  - redis_app_password
  - session_secret
  - mfa_encryption_key
  - mfa_encryption_keyring
  - preview_signing_key
  - contact_encryption_key
  - google_token_encryption_key

x-omnireach-runtime: &omnireach-runtime
  image: omnireach-runtime:${OMNIREACH_RELEASE_SHA:?Set OMNIREACH_RELEASE_SHA to the verified commit SHA}
  build:
    context: ../..
    dockerfile: infrastructure/compose/production.Dockerfile
    target: runtime
  env_file:
    - path: ${OMNIREACH_ENV_FILE:?Set OMNIREACH_ENV_FILE to the host-only production environment file}
      required: true
  environment:
    SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
  init: true
  networks:
    - backend
    - egress
  restart: unless-stopped
  secrets: *runtime-secrets
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *production-logging

services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: omnireach
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_USER: omnireach_db_admin
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -q -U omnireach_db_admin -d omnireach']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped
    secrets:
      - postgres_admin_password
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    stop_grace_period: 60s
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *production-logging

  redis:
    image: redis:8.2.4-alpine@sha256:a308ca111032fa8f306a2dc7be7ba5deb8b777ed5d258c733cddba48a1fd7904
    entrypoint: ['/opt/omnireach/redis-entrypoint.sh']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_app_password)" redis-cli --user omnireach_runtime ping 2>/dev/null | grep -qx PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    secrets:
      - redis_app_password
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    tmpfs:
      - /run:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    volumes:
      - redis-data:/data
      - ./scripts/redis-entrypoint.sh:/opt/omnireach/redis-entrypoint.sh:ro
    logging: *production-logging

  migrate:
    profiles: ['application']
    image: omnireach-migrator:${OMNIREACH_RELEASE_SHA:?Set OMNIREACH_RELEASE_SHA to the verified commit SHA}
    build:
      context: ../..
      dockerfile: infrastructure/compose/production.Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: 'no'
    secrets:
      - postgres_admin_password
      - postgres_app_password
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 256
    logging: *production-logging

  platform-data-init:
    profiles: ['application']
    image: omnireach-runtime:${OMNIREACH_RELEASE_SHA:?Set OMNIREACH_RELEASE_SHA to the verified commit SHA}
    build:
      context: ../..
      dockerfile: infrastructure/compose/production.Dockerfile
      target: runtime
    user: '0:0'
    entrypoint: ['/bin/sh', '-eu', '-c']
    command:
      - install -d -o node -g node -m 0750 /var/lib/omnireach/assets /var/lib/omnireach/previews /var/lib/omnireach/publications
    networks:
      - backend
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - platform-data:/var/lib/omnireach
    logging: *production-logging

  api:
    <<: *omnireach-runtime
    profiles: ['application']
    environment:
      PLATFORM_INQUIRY_ENABLED: 'true'
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
    networks:
      backend:
      egress:
      proxy:
        aliases:
          - omnireach-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      platform-data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.authContract!==3)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    ports:
      - 127.0.0.1:${OMNIREACH_API_PORT:-44100}:4100
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 30s
    volumes:
      - platform-data:/var/lib/omnireach

  scheduler:
    <<: *omnireach-runtime
    profiles: ['application']
    command: ['node', '--experimental-transform-types', 'workers/scheduler/src/main.ts']
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      WORKER_KIND: scheduler
    depends_on: &worker-dependencies
      migrate:
        condition: service_completed_successfully
      platform-data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &worker-healthcheck
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:fs').stat('/tmp/omnireach-worker-healthy',(e,s)=>process.exit(e||Date.now()-s.mtimeMs>90000?1:0))",
        ]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 96
    stop_grace_period: 45s

  runner:
    <<: *omnireach-runtime
    profiles: ['application']
    command: ['node', '--experimental-transform-types', 'workers/runner/src/main.ts']
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      WORKER_CATEGORIES: metrics_sync
      WORKER_KIND: runner
    depends_on: *worker-dependencies
    healthcheck: *worker-healthcheck
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 96
    stop_grace_period: 45s

  aio:
    <<: *omnireach-runtime
    profiles: ['application']
    command: ['node', '--experimental-transform-types', 'workers/runner/src/main.ts']
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      WORKER_CATEGORIES: aio_proposal
      WORKER_KIND: aio
    depends_on: *worker-dependencies
    healthcheck: *worker-healthcheck
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 96
    stop_grace_period: 45s

  publisher:
    <<: *omnireach-runtime
    profiles: ['application']
    command: ['node', '--experimental-transform-types', 'workers/runner/src/main.ts']
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      WORKER_CATEGORIES: publish
      WORKER_KIND: publisher
    depends_on: *worker-dependencies
    healthcheck: *worker-healthcheck
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - platform-data:/var/lib/omnireach
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 90s

  crawler:
    <<: *omnireach-runtime
    profiles: ['application']
    command: ['node', '--experimental-transform-types', 'workers/runner/src/main.ts']
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      WORKER_CATEGORIES: crawl
      WORKER_KIND: crawler
    depends_on: *worker-dependencies
    healthcheck: *worker-healthcheck
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 60s

  seo:
    <<: *omnireach-runtime
    profiles: ['application']
    command: ['node', '--experimental-transform-types', 'workers/runner/src/main.ts']
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      WORKER_CATEGORIES: seo_audit
      WORKER_KIND: seo
    depends_on: *worker-dependencies
    healthcheck: *worker-healthcheck
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 60s

  monitoring:
    <<: *omnireach-runtime
    profiles: ['application']
    command: ['node', '--experimental-transform-types', 'workers/runner/src/main.ts']
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      WORKER_CATEGORIES: health_check
      WORKER_KIND: monitoring
    depends_on: *worker-dependencies
    healthcheck: *worker-healthcheck
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 96
    stop_grace_period: 45s

  backup:
    profiles: ['operations']
    image: omnireach-migrator:${OMNIREACH_RELEASE_SHA:?Set OMNIREACH_RELEASE_SHA to the verified commit SHA}
    entrypoint: ['/opt/omnireach/infrastructure/backups/run-production-backup.sh']
    env_file:
      - path: ${OMNIREACH_ENV_FILE:?Set OMNIREACH_ENV_FILE to the host-only production environment file}
        required: true
    environment:
      SOURCE_COMMIT_SHA: ${OMNIREACH_RELEASE_SHA}
      OMNIREACH_PRODUCTION_ROOTS: /var/lib/omnireach:/var/backups/omnireach
      OMNIREACH_PRODUCTION_DATABASE_TARGETS: postgres:5432/omnireach
    init: true
    networks:
      - backend
      - egress
      - restore
    restart: 'no'
    read_only: true
    secrets:
      - postgres_admin_password
      - postgres_app_password
      - backup_encryption_key
      - backup_restore_password
      - r2_access_key_id
      - r2_secret_access_key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 128
    tmpfs:
      - /run/backup-runtime:size=16m,mode=0700
      - /tmp:size=256m,mode=1777
    volumes:
      - platform-data:/var/lib/omnireach:ro
      - ${OMNIREACH_BACKUP_ROOT:-/opt/backups/omnireach}:/var/backups/omnireach
    logging: *production-logging

  restore-postgres:
    profiles: ['restore-drill']
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_DB: omnireach_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/backup_restore_password
      POSTGRES_USER: omnireach_restore
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -q -U omnireach_restore -d omnireach_restore']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - restore
    restart: 'no'
    secrets:
      - backup_restore_password
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 128
    tmpfs:
      - /var/lib/postgresql/data:size=1g,mode=0700
    logging: *production-logging

  coops-mobile-detailing:
    image: omnireach-runtime:${OMNIREACH_RELEASE_SHA:?Set OMNIREACH_RELEASE_SHA to the verified commit SHA}
    profiles: ['application']
    entrypoint: ['node', 'infrastructure/compose/scripts/static-site-server.mjs']
    env_file:
      - path: ${OMNIREACH_ENV_FILE:?Set OMNIREACH_ENV_FILE to the host-only production environment file}
        required: true
    environment:
      STATIC_SITE_HOST: 0.0.0.0
      STATIC_SITE_PORT: '8080'
      STATIC_SITE_PUBLICATION_ROOT: /var/lib/omnireach/publications
      STATIC_SITE_ROOT: /opt/omnireach/sites/coops-mobile-detailing/dist
    init: true
    networks:
      proxy:
        aliases:
          - coops-mobile-detailing
    restart: unless-stopped
    read_only: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch(''http://127.0.0.1:8080/'').then(async r=>{const b=await r.text();if(!r.ok||!b.includes("Coop''s Mobile Detailing"))process.exit(1)}).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 15s
    volumes:
      - platform-data:/var/lib/omnireach:ro
    logging: *production-logging

  omnireach-public-site:
    image: omnireach-runtime:${OMNIREACH_RELEASE_SHA:?Set OMNIREACH_RELEASE_SHA to the verified commit SHA}
    profiles: ['application']
    entrypoint: ['node', 'infrastructure/compose/scripts/static-site-server.mjs']
    environment:
      STATIC_SITE_HOST: 0.0.0.0
      STATIC_SITE_PORT: '8080'
      STATIC_SITE_ROOT: /opt/omnireach/sites/omnireach/dist
    init: true
    networks:
      proxy:
        aliases:
          - omnireach-public-site
    restart: unless-stopped
    read_only: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/').then(async r=>{const b=await r.text();if(!r.ok||!b.includes('Websites, managed well'))process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    stop_grace_period: 15s
    logging: *production-logging

networks:
  backend:
    name: ${OMNIREACH_RESOURCE_PREFIX:-omnireach-production}-backend
    internal: true
  egress:
    name: ${OMNIREACH_RESOURCE_PREFIX:-omnireach-production}-egress
  proxy:
    external: true
    name: ${OMNIREACH_PROXY_NETWORK:-christiansreunite_frontend}
  restore:
    name: ${OMNIREACH_RESOURCE_PREFIX:-omnireach-production}-restore
    internal: true

volumes:
  platform-data:
    name: ${OMNIREACH_RESOURCE_PREFIX:-omnireach-production}-platform-data-v1
  postgres-data:
    name: ${OMNIREACH_RESOURCE_PREFIX:-omnireach-production}-postgres-v1
  redis-data:
    name: ${OMNIREACH_RESOURCE_PREFIX:-omnireach-production}-redis-v1

secrets:
  postgres_admin_password:
    file: ${OMNIREACH_SECRETS_DIR:?Set OMNIREACH_SECRETS_DIR to the protected secret directory}/postgres_admin_password
  postgres_app_password:
    file: ${OMNIREACH_SECRETS_DIR}/postgres_app_password
  redis_app_password:
    file: ${OMNIREACH_SECRETS_DIR}/redis_app_password
  session_secret:
    file: ${OMNIREACH_SECRETS_DIR}/session_secret
  mfa_encryption_key:
    file: ${OMNIREACH_SECRETS_DIR}/mfa_encryption_key
  mfa_encryption_keyring:
    file: ${OMNIREACH_SECRETS_DIR}/mfa_encryption_keyring
  preview_signing_key:
    file: ${OMNIREACH_SECRETS_DIR}/preview_signing_key
  contact_encryption_key:
    file: ${OMNIREACH_SECRETS_DIR}/contact_encryption_key
  google_token_encryption_key:
    file: ${OMNIREACH_SECRETS_DIR}/google_token_encryption_key
  backup_encryption_key:
    file: ${OMNIREACH_SECRETS_DIR}/backup_encryption_key
  backup_restore_password:
    file: ${OMNIREACH_SECRETS_DIR}/backup_restore_password
  r2_access_key_id:
    file: ${OMNIREACH_SECRETS_DIR}/r2_access_key_id
  r2_secret_access_key:
    file: ${OMNIREACH_SECRETS_DIR}/r2_secret_access_key
