name: Branch CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Validate workflow policy
        run: npm run check:workflows

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Verify production Compose contract
        run: npm run verify:production-compose

      - name: Build
        run: npm run build

      - name: Scan repository for secrets and forbidden paths
        run: npm run scan:secrets -- --full-history

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
