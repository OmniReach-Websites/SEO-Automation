name: Branch CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Validate workflow policy
        run: npm run check:workflows

      - name: Validate source release capability contract
        run: node infrastructure/deploy/create-release-metadata.mjs --check-contract

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Verify production Compose contract
        run: npm run verify:production-compose

      - name: Build
        run: npm run build

      - name: Scan repository for secrets and forbidden paths
        run: npm run scan:secrets -- --scope full

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
